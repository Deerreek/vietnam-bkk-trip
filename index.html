<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Trip Planner: Vietnam & Bangkok</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; font-family: 'Courier New', Courier, monospace; display: flex; background-color: #121212; color: #00ffcc; }
        #sidebar { width: 380px; padding: 20px; height: 100vh; overflow-y: auto; border-right: 1px solid #333; box-sizing: border-box; display: flex; flex-direction: column; }
        #map { flex-grow: 1; height: 100vh; }
        h2 { color: #ff00ff; text-transform: uppercase; font-size: 1.2rem; letter-spacing: 2px; margin-top: 0; }
        
        /* Day Selector Styling */
        .timeline-filter { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 15px; border-bottom: 1px solid #333; margin-bottom: 15px; min-height: 45px;}
        .day-btn { background: #1e1e1e; border: 1px solid #444; color: #aaa; padding: 6px 10px; cursor: pointer; font-family: inherit; font-size: 0.75rem; white-space: nowrap; transition: 0.2s; }
        .day-btn:hover { border-color: #00ffcc; color: #00ffcc; }
        .day-btn.active { background: #00ffcc; border-color: #00ffcc; color: #121212; font-weight: bold; }
        
        /* Location List Card Styling */
        #list { flex-grow: 1; overflow-y: auto; }
        .loc-card { background: #1e1e1e; padding: 15px; margin-bottom: 10px; border: 1px solid #333; cursor: pointer; transition: 0.2s; position: relative; }
        .loc-card:hover { border-color: #ff00ff; }
        .day-badge { position: absolute; top: 15px; right: 15px; font-size: 0.7rem; background: #333; color: #ff00ff; padding: 2px 6px; border-radius: 3px; }
        
        /* Retro Map Markers */
        .retro-marker {
            background-color: #ff00ff;
            color: #121212;
            border: 2px solid #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 10px #ff00ff;
            cursor: pointer;
        }
        .retro-marker.all-day {
            background-color: #00ffcc;
            border-color: #ff00ff;
            box-shadow: 0 0 10px #00ffcc;
        }

        /* Custom Popup Styling */
        .leaflet-popup-content-wrapper { background-color: #1e1e1e; color: #00ffcc; border: 1px solid #ff00ff; border-radius: 0; font-family: 'Courier New', Courier, monospace; }
        .leaflet-popup-tip { background-color: #1e1e1e; border: 1px solid #ff00ff; }
        .leaflet-popup-content b { color: #ff00ff; font-size: 1.1em; }
    </style>
</head>
<body>

<div id="sidebar">
    <h2>Trip Control Panel</h2>
    
    <div class="timeline-filter" id="timelineFilter">
        <button class="day-btn active" onclick="filterDay('ALL')">ALL</button>
    </div>
    
    <div id="list"></div>
</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const map = L.map('map').setView([14.0583, 108.2772], 5);
    
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap &copy; CARTO',
        maxZoom: 20
    }).addTo(map);

    const itinerary = [
            { date: "2026-05-21", dayLabel: "Day 1", name: "Da Nang Arrival", lat: 16.0544, lng: 108.2022, notes: "Land in Vietnam, settle into coastal base." },
            { date: "2026-05-21", dayLabel: "Day 1", name: "Đến Đà Nẵng & Check-in", lat: 16.0573, lng: 108.2170, notes: "Hạ cánh, nhận phòng Airbnb tại 338/28 Hoàng Diệu." },
            { date: "2026-05-21", dayLabel: "Day 1", name: "Nhà hàng Thìa Gỗ", lat: 16.0529, lng: 108.2415, notes: "Buổi chiều: Di chuyển qua 53 Phan Thúc Duyện để ăn uống sau khi cất hành lý." },
            { date: "2026-05-21", dayLabel: "Day 1", name: "NHÀN CAFE", lat: 16.0613, lng: 108.2438, notes: "Chiều/Tối: Thưởng thức cà phê thư giãn tại 302 Hồ Nghinh." },
            { date: "2026-05-21", dayLabel: "Day 1", name: "Golden Lotus Organic Spa", lat: 16.0673, lng: 108.2445, notes: "16:15: Arrive for massage and relaxation." },
            { date: "2026-05-21", dayLabel: "Day 1", name: "The Roof - Da Nang", lat: 16.0694, lng: 108.2452, notes: "19:30: Evening drinks, music, and ocean views at 1A Vo Nguyen Giap." },
            { date: "2026-05-22", dayLabel: "Day 2", name: "Ba Na Hills SunWorld", lat: 15.9984, lng: 107.9863, notes: "8:00 AM - 3:00 PM: Golden Bridge, Alpine Coaster, and retro indoor arcades." },
            { date: "2026-05-22", dayLabel: "Day 2", name: "Hải sản Mộc quán", lat: 16.0596, lng: 108.2435, notes: "19:00: Enjoy fresh local seafood dinner at 26 To Hien Thanh." },
            { date: "2026-05-22", dayLabel: "Day 2", name: "Da Nang Base", lat: 16.0544, lng: 108.2022, notes: "Return to base, explore local food scene in evening." },
            { date: "2026-05-23", dayLabel: "Day 3", name: "Depart Da Nang", lat: 16.0544, lng: 108.2022, notes: "Morning: 9:00 AM departure. Private transport heading south to Hoi An." },
            { date: "2026-05-23", dayLabel: "Day 3", name: "Arrival in Hoi An", lat: 15.8801, lng: 108.3380, notes: "Morning: 10:00 AM arrival. Explore the ancient town architecture and grab a local coffee." },
            { date: "2026-05-23", dayLabel: "Day 3", name: "Leather & Craft District", lat: 15.8785, lng: 108.3286, notes: "Afternoon: Custom measurements or hands-on classes at Aloha Leather / Da Bao." },
            { date: "2026-05-23", dayLabel: "Day 3", name: "Hoi An Night Market", lat: 15.8761, lng: 108.3248, notes: "Evening: Lanterns, street food, and river views. Depart for Da Nang late at night." },
            { date: "2026-05-24", dayLabel: "Day 4", name: "My Khe Beach", lat: 16.0616, lng: 108.2469, notes: "2:00 PM: Afternoon arrival for water sports, surfing, or lounging on the sand." },
            { date: "2026-05-24", dayLabel: "Day 4", name: "Kalà Kalà Beach Club", lat: 16.0476, lng: 108.2496, notes: "5:30 PM: Open-air outdoor club on the shoreline for sunset drinks and evening lounge music." },
            { date: "2026-05-25", dayLabel: "Day 5", name: "Da Nang Final Day", lat: 16.0544, lng: 108.2022, notes: "Open slot: Packing and final local sights." },
            { date: "2026-05-25", dayLabel: "Day 5", name: "DONALD TRUNG ĐÀ NẴNG", lat: 16.0506, lng: 108.2461, notes: "20:30: Shopping at the streetwear and sneaker boutique at 141 Do Ba." },
            { date: "2026-05-26", dayLabel: "Day 6", name: "Airbnb Check-In", lat: 13.7664, lng: 100.6728, notes: "18:00: Arrive and check into Airbnb at Soi Ramkhamhaeng 90 atCheckIn." },            { date: "2026-05-26", dayLabel: "Day 6", name: "Ning's Mango Stand", lat: 13.7236, lng: 100.5788, notes: "Afternoon: First treat in Bangkok! Grab fresh mango sticky rice at 4 Sukhumvit Rd." },
            { date: "2026-05-26", dayLabel: "Day 6", name: "Somsak Pu-ob", lat: 13.7263, lng: 100.4945, notes: "Evening: Legendary baked glass noodles with crab and prawns in clay pots." },
            { date: "2026-05-27", dayLabel: "Day 7", name: "Kuay Jab Mr. Joe", lat: 13.7092, lng: 100.5142, notes: "Breakfast: Famous crispy pork belly and peppery kuay jab noodles at 313/7 Chan Rd." },
            { date: "2026-05-27", dayLabel: "Day 7", name: "AantArm Cafe", lat: 13.7206, lng: 100.4764, notes: "Lunch: Must lunch here! Great cafe and food in the Talat Phlu area at 1231/6 Thoet Thai Rd." },
            { date: "2026-05-27", dayLabel: "Day 7", name: "Blulagoon @ Lido Connect", lat: 13.7453, lng: 100.5325, notes: "14:30: Explore local indie fashion, vintage, and creative brands at Siam Square." },
            { date: "2026-05-27", dayLabel: "Day 7", name: "centralwOrld", lat: 13.7465, lng: 100.5391, notes: "16:30: Walk the skywalk to the mega-mall for massive global brands and browsing." },
            { date: "2026-05-28", dayLabel: "Day 8", name: "Bangkok Creative Hubs", lat: 13.7650, lng: 100.5300, notes: "Open slot: Gallery spaces, exhibition scouting." },
            { date: "2026-05-28", dayLabel: "Day 8", name: "Cocoa Amma", lat: 13.5966, lng: 100.5964, notes: "19:00: Night event! Head to Pak Nam Market for the legendary, ultra-thick iced cocoa." },
            { date: "2026-05-29", dayLabel: "Day 9", name: "Bangkok Departure", lat: 13.7563, lng: 100.5018, notes: "Wrap up souvenirs, transit back to airport." }
        ];

    let currentMarkers = [];
    let currentRouteLine = null;

    function initTimelineButtons() {
        const filterContainer = document.getElementById('timelineFilter');
        const uniqueDates = [];
        
        itinerary.forEach(item => {
            if (!uniqueDates.some(d => d.date === item.date)) {
                uniqueDates.push({ date: item.date, label: item.dayLabel });
            }
        });
        
        uniqueDates.forEach(d => {
            const btn = document.createElement('button');
            btn.className = 'day-btn';
            const shortDate = d.date.substring(5).replace('-', '/');
            btn.innerText = `${d.label} (${shortDate})`;
            btn.id = `btn-${d.date}`;
            btn.onclick = () => filterDay(d.date);
            filterContainer.appendChild(btn);
        });
    }

    function filterDay(targetDate) {
        document.querySelectorAll('.day-btn').forEach(btn => btn.classList.remove('active'));
        if (targetDate === 'ALL') {
            document.querySelector('.day-btn').classList.add('active');
        } else {
            document.getElementById(`btn-${targetDate}`).classList.add('active');
        }

        currentMarkers.forEach(m => map.removeLayer(m));
        currentMarkers = [];
        if (currentRouteLine) {
            map.removeLayer(currentRouteLine);
            currentRouteLine = null;
        }

        const listEl = document.getElementById('list');
        listEl.innerHTML = '';

        const filteredData = targetDate === 'ALL' ? itinerary : itinerary.filter(item => item.date === targetDate);
        const routeCoords = [];

        filteredData.forEach((place, index) => {
            const sequenceNum = index + 1;
            
            // Create the numbered div icon
            const markerClass = targetDate === 'ALL' ? 'retro-marker all-day' : 'retro-marker';
            const numberedIcon = L.divIcon({
                className: 'custom-icon', // Wrapper class
                html: `<div class="${markerClass}" style="width: 24px; height: 24px;">${sequenceNum}</div>`,
                iconSize: [24, 24],
                iconAnchor: [12, 12],
                popupAnchor: [0, -12]
            });

            const marker = L.marker([place.lat, place.lng], { icon: numberedIcon }).addTo(map);
            
            // Styled popup content
            marker.bindPopup(`<b>[${sequenceNum}] ${place.name}</b><br><span style="color: #aaa; font-size: 0.9em;">${place.notes}</span>`);
            currentMarkers.push(marker);
            routeCoords.push([place.lat, place.lng]);

            // Append matching items to sidebar panel with matching number
            const card = document.createElement('div');
            card.className = 'loc-card';
            card.innerHTML = `
                <div class="day-badge">${place.dayLabel}</div>
                <strong><span style="color: ${targetDate === 'ALL' ? '#00ffcc' : '#ff00ff'};">[0${sequenceNum}]</span> ${place.name}</strong><br>
                <span style="font-size:0.8rem; color:#aaa; display:inline-block; margin-top:8px;">${place.notes}</span>
            `;
            // Hover over card to open map popup automatically
            card.onmouseenter = () => marker.openPopup();
            card.onclick = () => map.flyTo([place.lat, place.lng], targetDate === 'ALL' ? 7 : 13);
            listEl.appendChild(card);
        });

        if (routeCoords.length > 1) {
            currentRouteLine = L.polyline(routeCoords, {
                color: targetDate === 'ALL' ? '#00ffcc' : '#ff00ff',
                weight: 2,
                dashArray: '5, 8',
                opacity: 0.8
            }).addTo(map);
            
            map.fitBounds(currentRouteLine.getBounds(), { padding: [50, 50] });
        } else if (routeCoords.length === 1) {
            map.setView(routeCoords[0], 13);
        }
    }

    initTimelineButtons();
    filterDay('ALL');
</script>
</body>
</html>
